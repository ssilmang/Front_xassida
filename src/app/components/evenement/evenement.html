<div class="min-h-screen flex flex-col">
  <main class="flex-1 py-12">
    <div class="container">

      <!-- Page Header -->
      <div class="mb-10">
        <div class="flex items-center gap-3 mb-4">
          <div
            class="w-12 h-12 rounded-lg bg-gray-900/10 text-green-900 flex items-center justify-center"
          >
            <lucide-icon
              [name]="Calendar"
              class="h-6 w-6 text-primary"
            ></lucide-icon>
          </div>

          <div>
            <h1 class="font-heading text-3xl font-bold text-foreground">
              Événements
            </h1>
            <p class="text-muted-foreground text-green-900">
              Célébrations et rassemblements religieux
            </p>
          </div>
        </div>
      </div>

      <!-- Events Grid -->
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (event of events(); track event.id; let i = $index) {
          <div
            class="animate-slide-up"
            [style.animation-delay.ms]="i * 100"
          >
            <app-evenement-card [event]="event"></app-evenement-card>
          </div>
        }
      </div>

    </div>
  </main>
</div>
