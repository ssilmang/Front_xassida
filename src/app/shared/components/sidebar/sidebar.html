<!-- Hamburger Menu -->
<div class="hamburger-menu p-4">
  <button (click)="toggleSidebar()" 
          class="p-2 rounded-full hover:bg-gray-100 transition-colors">
    <span class="material-icons">menu</span>
  </button>
</div>
<!-- Overlay avec ombre -->
 @if (!isCollapsed()) {
   <div  
        (click)="toggleSidebar()"
        class="fixed inset-0 z-40 bg-black/50 ">
   </div>
 }

<!-- Sidebar -->
<aside [class.w-50]="!isCollapsed()" 
       [class.w-0]="isCollapsed()"
       tabindex="-1" 
       class="bg-slate-900  text-gray-400 h-screen overflow-y-auto transition-all duration-300 flex flex-col border-r border-gray-200 fixed left-0 top-0 z-50">
  
  <!-- Header -->
  <div class="flex items-center w-full justify-between px-3 py-3.5 border-b border-gray-200">
    <a href="#" class="flex items-center gap-3">
      <span class="w-12 px-1 mr-2 rounded-md bg-orange-600 text-center  text-xl font-bold text-white flex items-center justify-center">
        MKN
      </span>
      <span class="text-xl font-semibold tracking-wide">Xassida</span>
    </a>
    
    <button (click)="toggleSidebar()" 
            class="p-1 rounded hover:bg-gray-100 transition-colors">
      <span class="material-icons">close</span>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="mt-4 flex-1 px-2">
    <ul class="space-y-1">
       <li>
        <a  routerLink="/xassidas" 
           routerLinkActive="active"
           class="menu-item group flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-gray-100 transition-colors">
          
          <span class="material-icons text-gray-700">dashboard</span>
          <span class="text-sm font-medium">Xassida</span>
        </a>
      </li>
      <!-- Dashboard -->
      <li>
        <a (click)="alert()" routerLink="/dashboard" 
           routerLinkActive="active"
           class="menu-item group flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-gray-100 transition-colors">
          
          <span class="material-icons text-gray-700">dashboard</span>
          <span class="text-sm font-medium">Dashboard</span>
        </a>
      </li>

      <!-- Utilisateurs -->
      <li>
        <a (click)="alert()" routerLink="/user" 
           routerLinkActive="active"
           class="menu-item group flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-gray-100 transition-colors">
          
          <span class="material-icons text-gray-700">people</span>
          <span class="text-sm font-medium">Utilisateurs</span>
        </a>
      </li>

      <!-- Produits -->
      <li>
        <a routerLink="/products" 
           routerLinkActive="active"
           class="menu-item group flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-gray-100 transition-colors">
          
          <span class="material-icons text-gray-700">inventory_2</span>
          <span class="text-sm font-medium">Produits</span>
        </a>
      </li>

      <!-- Commandes -->
      <li>
        <a routerLink="/orders" 
           routerLinkActive="active"
           class="menu-item group flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-gray-100 transition-colors">
          
          <span class="material-icons text-gray-700">shopping_cart</span>
          <span class="text-sm font-medium">Commandes</span>
        </a>
      </li>

      <!-- Paramètres -->
      <li>
        <a routerLink="/settings" 
           routerLinkActive="active"
           class="menu-item group flex items-center gap-3 px-3 py-3 rounded-lg hover:bg-gray-100 transition-colors">
          
          <span class="material-icons text-gray-700">settings</span>
          <span class="text-sm font-medium">Paramètres</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer -->
  <div class="p-3 border-t border-gray-200 mt-auto">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center">
        <span class="text-xs font-medium text-white">U</span>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-medium truncate">Utilisateur</p>
        <p class="text-xs text-gray-400 truncate">Admin</p>
      </div>
    </div>
  </div>
</aside>

<!-- Overlay pour fermer le sidebar -->
 @if (!isCollapsed()) {
     <div  
          (click)="toggleSidebar()"
          class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden">
     </div>
 }
